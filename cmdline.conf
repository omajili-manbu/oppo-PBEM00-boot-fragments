# ============================================================================
# bootable_337_C7_usbser.img — kernel cmdline 配置（22 参数 / 471 字符）
# ============================================================================
# 来源镜像 : C:\Users\QWE12\Desktop\bootable_337_C7_usbser.img
#            header v1 / os_version=0x14000155 → Android 10.0, patch 2021-05
#            64MiB 整 boot 分区镜像；kernel 14.6MB = g74c28613 + 拆门dtb 1e3ca518 拼接
# 提取日期 : 2026-11-13（boot header cmdline 512B + extra_cmdline 1024B，extra 为空）
# 拼接规则 : 所有非 # 开头的参数行按文件内顺序、以单空格拼接 = 完整 cmdline
# 已知怪癖 : 原镜像 cmdline 在 panic=30 与 watchdog_v2.enable=0 之间有一次双空格
#            （构建脚本拼接残留）；内核解析时空参数被跳过，语义等价。
#            本文件已规范化为单空格，拼回结果 token 级与原镜像一致。
# 铁律     : 1) console= 有两条，最后一条(ttyGS0)成为 /dev/console —— 顺序即语义，
#               本文件参数行不得重排；
#            2) usbwait= 必须与 console=ttyGS0 配对存在，撤要一起撤；
#            3) LK/abl 运行时还会追加 androidboot.serialno/mode/bootreason 等，
#               机上 /proc/cmdline 比本文件长，本文件是底稿。
# 标签图例 : (stock)=原厂继承  (dbg)=调试放宽  (ser)=串口管线
#            (ff)=fail-fast/取证  (sar)=SAR启动  (own)=自定义门禁参数
# ============================================================================

# [01] (stock)(ser) 硬件 UART console —— 排在首位 = 仅作为附加 console
#   SDM670 的 GENI 串口注册为内核 console，115200 波特/无校验/8 数据位。
#   原厂参数，LK 阶段日志同口。R17 的 UART 焊盘未引出，实际通路是 USB 串口，
#   这条只是 printk 双发目标之一，无害保留，真正的主角是 [12]。
console=ttyMSM0,115200n8

# [02] (stock) 硬件名 → ro.hardware=qcom
#   init 据此挑选硬件相关的 init rc（init.qcom.rc 等）。原厂标配。
androidboot.hardware=qcom

# [03] (stock) init 的 console 服务指向 UART
#   → ro.boot.console=ttyMSM0。注意不对称：init 的 console 服务认 UART，
#   而 /dev/console 实际落在 [12] ttyGS0 上（preferred console 规则，见 [12]）。
androidboot.console=ttyMSM0

# [04] (stock) QC Service Locator 驱动开关
#   子系统服务注册 / SSR 诊断用。与串口管线无交集，纯继承。
service_locator.enable=1

# [05] (stock) USB gadget 走 configfs
#   → ro.boot.usbconfigfs=1。Android 9+ 标准做法，
#   adb / g_serial 的 function 组合都靠 configfs 搭建。
androidboot.configfs=true

# [06] (stock)(ser) 指定 gadget 绑定的 UDC
#   UDC = a600000.dwc3（SDM670 主 USB 控制器）。与 u_serial 属主守卫(74c28613)
#   直接挂钩：g_serial 与 adb 抢的就是这个 UDC 的属主，拿到它才有 ttyGS0。
androidboot.usbcontroller=a600000.dwc3

# [07] (stock) 软件 IO TLB（DMA 弹跳缓冲）大小参数
#   SDM670 外设基本走 SMMU，SWIOTLB 仅兜底，原样继承即可。
swiotlb=1

# [08] (stock) loop 设备分区扫描上限
#   每个 loop 设备最多自动扫描 8 个分区（0-7）。Android 通用惯例参数。
loop.max_part=7

# [09] (stock) 用户级系统形态 → ro.build.type=user
#   与 [11] permissive 配套 = "user 底包 + 自制调试内核" 组合。
buildvariant=user

# [10] (dbg) 关内核审计子系统
#   audit log 关闭：少刷日志、省开销。
audit=0

# [11] (dbg) SELinux 放宽
#   init 把 SELinux 置为 permissive。自制内核 + 移植服务（hypnus/kevent、g_serial
#   管线）无配套 sepolicy，enforcing 会把它们打死在半路。调试镜像通行做法。
androidboot.selinux=permissive

# [12] (ser) ★全镜像最重的一条：USB gadget 串口 console
#   ttyGS0 注册为 console，且是最后一条 console= → 成为 preferred console
#   → /dev/console → init 的 stdin/stdout/stderr 与 init 日志全走 USB 串口。
#   printk 对每条 console 双发：主机 serial_watch 能同时看到内核 printk + init
#   输出，"整批上屏"的机制基础。115200 只是名义波特率，USB 实际速率不受限。
#   生效前提 = g_serial 内建 + UDC 绑定 + 主机打开 COM 口 → 依赖 [22] usbwait 门禁。
console=ttyGS0,115200

# [13] (ff) panic 后 30 秒自动重启
#   无人值守抓日志时死机自愈。当年"30s 重启环"案的嫌疑现场即此环路
#   （反复 oops → panic → 30s → 重启），后证实大概率被属主守卫治好。
panic=30

# [14] (ff) 关 QC msm_watchdog v2 硬狗
#   硬狗咬人 = 直接复位 SoC，串口日志来不及出完、pstore 留不下现场。
#   关硬狗后走软路径（[19][20] 软狗 → panic → 自愈），量产绝不可用。
watchdog_v2.enable=0

# [15] (sar) SAR 根设备
#   root = UFS 主控 1d84000.ufshc 下按名索引的 system 分区（sda11），
#   init 直接从这里挂 / —— system_merged.img（4.56GiB）就写在这个分区。
root=/dev/block/platform/soc/1d84000.ufshc/by-name/system

# [16] (sar) 跳过 ramdisk
#   不解包 boot.img 里的 ramdisk，直接以 [15] 为根起 init。
#   PBEM00 原厂即 SAR + ext4-only 内核；镜像里 326KB ramdisk 纯属占位，被无视。
skip_initramfs

# [17] (ff) console loglevel 拉满
#   printk 控制台级别 = 8（KERN_DEBUG 全放行）。串口取证要全量日志。
loglevel=8

# [18] (ff) 无视一切 loglevel
#   所有 printk（含被 pr_debug/动态调试关掉的）一律上 console。
#   宁可串口过载、绝不丢现场；与 serial_watch v7 整批上屏配套。
ignore_loglevel

# [19] (ff) oops 即 panic
#   空指针、坏页错误等内核故障直接 panic，不带病运行；
#   联动 [21] 全量落 pstore + [13] 30 秒自愈。
oops=panic

# [20] (ff) soft lockup 即 panic
#   某 CPU 内核态卡死、watchdog 内核线程喂不上 → 从"仅打印"升级为 panic。
#   把死锁变成可观测事件（回栈→pstore→自愈）。与 [14] 关硬狗配套，选软取证路线。
softlockup_panic=1

# [21] (ff) panic 时全量导出内核日志
#   kmsg_dump 回调在 panic/oops/紧急重启时导出完整 log 缓冲，
#   保证 ramoops/pstore 拿到全量而非尾部截断。取证链（/sys/fs/pstore）基石。
printk.always_kmsg_dump=1

# [22] (own) ★唯一自定义参数：ttyGS0 console 就绪门禁（88fec00b 引入）
#   u_serial.c: core_param(usbwait, gserial_boot_wait_timeout, int, 0644)，单位秒。
#   kernel_init 在交权用户态前调用 gserial_console_boot_wait()：
#   阻塞等待 ttyGS0 数据通路挂上（gserial_connect→gs_console_connect，
#   判据 port_usb + console_req 就绪）最多 10 秒，就绪后再固定留 5 秒宽限窗
#   给主机端打开 COM 口。默认 -1 = 不阻塞。
#   为什么：init 若在开机几秒内 panic，主机侧 usbser 还没打开 COM 口，
#   早期日志全丢；本参数保证"主机上屏前内核不动"。三板斧之一：
#   8c928271(拆 dwc3 defer 门,早探针) + 74c28613(属主守卫,防抢 UDC) + 本条(时间阀)。
usbwait=10

# ============================================================================
