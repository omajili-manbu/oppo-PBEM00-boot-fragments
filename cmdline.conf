#   必撤 : [12] console=ttyGS0、[22] usbwait=10     —— 串口管线专属
#   应撤 : [14] 关硬狗、[18] ignore_loglevel、[19] oops=panic、
#          [20] softlockup_panic=1、[21] always_kmsg_dump —— fail-fast 取证专属
#          （量产要恢复硬狗看门）
